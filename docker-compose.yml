services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-solicitacoes-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal_solicitacoes}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_solicitacoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: portal-solicitacoes-api
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/portal_solicitacoes}
      DB_USERNAME: ${DB_USERNAME:-portal}
      DB_PASSWORD: ${DB_PASSWORD:-portal}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
