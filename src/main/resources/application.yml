spring:
  application:
    name: portal-solicitacoes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portal_solicitacoes}
    username: ${DB_USERNAME:portal}
    password: ${DB_PASSWORD:portal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
